[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quilt-hp-python"
version = "0.5.1"
description = "Async Python client for Quilt mini-split HVAC systems"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
authors = [{ name = "Emmanuel" }]
keywords = ["quilt", "hvac", "mini-split", "grpc", "home-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Typing :: Typed",
    "Framework :: AsyncIO",
]
dependencies = [
    "grpcio>=1.70",
    "protobuf>=5.0",
    "boto3>=1.35",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
cli = [
    "typer>=0.12",
    "rich>=13.0",
    "textual>=0.80",
]
dev = [
    "ruff>=0.11",
    "mypy>=1.15",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "build>=1.2",
    "twine>=6.0",
    "grpcio-tools==1.78.0",
    "mypy-protobuf>=3.6",
    "boto3-stubs[cognito-idp]",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.29",
]

[project.scripts]
quilt = "quilt_hp.cli.main:app"

[project.urls]
Repository = "https://github.com/eman/quilt-hp-python"
Issues = "https://github.com/eman/quilt-hp-python/issues"
Changelog = "https://github.com/eman/quilt-hp-python/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/quilt_hp"]

[tool.ruff]
target-version = "py314"
line-length = 99
src = ["src", "tests"]
exclude = ["src/quilt_hp/_proto"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle (PEP 8)
    "F",         # pyflakes
    "I",         # isort
    "B",         # flake8-bugbear
    "UP",        # pyupgrade
    "RUF",       # ruff-specific
    "SIM",       # flake8-simplify
    "TCH",       # type-checking imports
    "ASYNC",     # flake8-async
]
ignore = [
    "E501",    # long lines in rich/textual UI rendering code
    "RUF001",  # ambiguous unicode in protocol-oriented text
    "RUF002",
    "RUF003",
    "SIM102",
    "SIM105",
    "SIM108",
    "TC001",
    "TC003",
    "ASYNC251",
    "RUF059",
]

[tool.ruff.lint.isort]
known-first-party = ["quilt_hp"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["quilt_hp"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "quilt_hp._proto.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "quilt_hp.cli.tui"
ignore_errors = true

[[tool.mypy.overrides]]
module = "google.protobuf.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "grpc.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "boto3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "botocore.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --cov=quilt_hp --cov-report=term-missing --cov-fail-under=80 -p no:homeassistant"
asyncio_mode = "auto"


[tool.coverage.run]
# Exclude generated protobuf stubs and the interactive TUI shell from unit-test gating.
omit = [
    "src/quilt_hp/_proto/*",
    "src/quilt_hp/cli/tui.py",
]

[tool.coverage.report]
fail_under = 80
