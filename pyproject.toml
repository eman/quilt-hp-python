[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quilt-hp-python"
version = "0.1.0"
description = "Async Python client for Quilt mini-split HVAC systems"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Emmanuel" }]
keywords = ["quilt", "hvac", "mini-split", "grpc", "home-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Typing :: Typed",
    "Framework :: AsyncIO",
]
dependencies = [
    "grpcio>=1.70",
    "protobuf>=5.0",
    "boto3>=1.35",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
cli = [
    "typer>=0.12",
    "rich>=13.0",
    "textual>=0.80",
]
dev = [
    "ruff>=0.11",
    "mypy>=1.15",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "grpcio-tools>=1.70",
    "mypy-protobuf>=3.6",
    "boto3-stubs[cognito-idp]",
]

[project.scripts]
quilt = "quilt_hp.cli.main:app"

[project.urls]
Repository = "https://github.com/example/quilt-hp-python"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/quilt_hp"]

[tool.ruff]
target-version = "py312"
line-length = 99
src = ["src", "tests"]
exclude = ["src/quilt_hp/_proto"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle (PEP 8)
    "F",         # pyflakes
    "I",         # isort
    "B",         # flake8-bugbear
    "UP",        # pyupgrade
    "RUF",       # ruff-specific
    "SIM",       # flake8-simplify
    "TCH",       # type-checking imports
    "ASYNC",     # flake8-async
]
ignore = [
    "E501",    # long lines in rich/textual UI rendering code
    "RUF001",  # ambiguous unicode in protocol-oriented text
    "RUF002",
    "RUF003",
    "SIM102",
    "SIM105",
    "SIM108",
    "TC001",
    "TC003",
    "ASYNC251",
    "RUF059",
]

[tool.ruff.lint.isort]
known-first-party = ["quilt_hp"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["quilt_hp"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "quilt_hp._proto.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "quilt_hp.auth",
    "quilt_hp.transport",
    "quilt_hp.client",
    "quilt_hp.cli.*",
    "quilt_hp.models.controller",
    "quilt_hp.models.space",
    "quilt_hp.models.system",
    "quilt_hp.services.hds",
    "quilt_hp.services.streaming",
    "quilt_hp.services.system",
    "quilt_hp.services.user",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = "google.protobuf.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "grpc.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "boto3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "botocore.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"
