site_name: quilt-hp-python
site_description: Async Python client, CLI, and TUI for Quilt HVAC systems
site_url: https://eman.github.io/quilt-hp-python/
repo_url: https://github.com/eman/quilt-hp-python
repo_name: eman/quilt-hp-python
theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            docstring_style: google
            merge_init_into_class: true
            filters:
              - "!^_"
nav:
  - Home: index.md
  - Tutorial:
      - Get started: tutorial/get-started.md
  - How-to guides:
      - Authenticate and manage tokens: how-to/authenticate.md
      - Control spaces and indoor units: how-to/control-spaces.md
      - Stream real-time updates: how-to/stream-updates.md
      - Configure comfort settings: how-to/configure-comfort-settings.md
      - Configure schedules: how-to/configure-schedules.md
      - Build a Home Assistant component: how-to/home-assistant.md
      - Build an automation daemon: how-to/automation-daemon.md
      - Automate with the CLI: how-to/cli-scripting.md
      - Build a TUI app: how-to/tui-app.md
      - Regenerate protobuf stubs: how-to/regenerate-protos.md
      - Contribute to the project: how-to/contribute.md
  - Reference:
      - QuiltClient: reference/client.md
      - API reference: reference/api-reference.md
      - Models: reference/models.md
      - Token management: reference/token-management.md
      - HDS entities: reference/hds-entities.md
      - gRPC services matrix: reference/grpc-services-matrix.md
      - Documentation standards: reference/documentation-standards.md
  - Explanation:
      - Architecture: explanation/architecture.md
      - Snapshot and stream data model: explanation/snapshot-and-stream.md
      - Authentication and token lifecycle: explanation/authentication.md
      - The streaming protocol: explanation/streaming-protocol.md
      - gRPC and protobuf: explanation/grpc-and-protobuf.md
