  google.protobuf.Timestamp updated_ts = 1;
  float temperature_setpoint_c = 2;
  float ambient_temperature_c = 3;
  HVACState hvac_state = 4;
  float fan_speed_setpoint_rpm = 5;
  float fan_speed_rpm = 6;
  float light_brightness_percent = 7;  // device-observed actual brightness (0.0–1.0)
  float presence_detection_level = 8;
  float inlet_temperature_c = 9;
  float outlet_temperature_c = 10;
  float ambient_humidity_percent = 11;
  HVACMode hvac_mode = 12;
  float calculated_ambient_temperature_c = 13;
  float louver_angle_up_down_degrees = 14;
  IndoorUnitTestMode test_mode = 15;  // app 1.0.33; seen in captures since 2026-05
  float coil_temperature_c = 16;  // app 1.0.33; seen in captures since 2026-05
  LightState led_state = 17;  // app 1.0.33; seen in captures since 2026-05 (device-reported LED state)
  float inlet_humidity_percent = 18;  // app 1.0.33; seen live 2026-10-05
}

