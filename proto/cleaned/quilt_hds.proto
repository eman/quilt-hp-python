message ControllerState {
  reserved 1;
  float sht4x_temperature_c = 2;  // Sensirion SHT4x temp (~24–29°C; self-heating bias). Was ambient_temperature_c
  float encoder_temperature_c = 3;  // rotary-encoder board temp (~30–50°C). Was temperature_f3
  float soc_temperature_c = 4;  // i.MX 93 SoC temp (~45–52°C). Was temperature_f4
  float calculated_ambient_temperature_c = 5;  // corrected ambient sent to the IDU as external_ambient_temperature_c. Was temperature_f5
  float power_meter_w = 6;
