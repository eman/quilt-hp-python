// ---------------------------------------------------------------------------
// Common sub-messages — EntityMetadata (the "header" field on all HDS objects)
// ---------------------------------------------------------------------------

// All HDS objects share EntityMetadata at field 1 (JSON name: "header").
// Wire-confirmed field layout from binary decode: object_id=1, created_ts=2, updated_ts=3, system_id=4.
message EntityMetadata {
  string object_id = 1;  // JSON: "objectId"
  google.protobuf.Timestamp created_ts = 2;
  google.protobuf.Timestamp updated_ts = 3;  // may be absent on some objects
  string system_id = 4;  // JSON: "systemId" — organization/system UUID
}

// ---------------------------------------------------------------------------
// Location
// ---------------------------------------------------------------------------

message LocationAttributes {
  google.protobuf.Timestamp updated_ts = 1;
  string name = 2;
  string tz_identifier = 3;  // JSON: "tzIdentifier" e.g. "America/Los_Angeles"
}

message LocationControls {
  google.protobuf.Timestamp updated_ts = 1;
  ScheduleExecution schedule_execution = 2;
}

// Wire field layout confirmed: header=1, attributes=2, controls=3.
message Location {
  EntityMetadata header = 1;
  LocationAttributes attributes = 2;
  LocationControls controls = 3;
}

// ---------------------------------------------------------------------------
// Space
// ---------------------------------------------------------------------------

// Space relationships. f1 was customer_account_id in an old iOS JSON dump; it is absent from
// app 1.0.33 and from every capture (2026-05..07), so it is reserved.
message SpaceRelationships {
  reserved 1; reserved "customer_account_id";
  string parent_space_id = 2;  // empty for root space; JSON: "parentSpaceId"
  google.protobuf.Timestamp updated_ts = 3;
}

// Wire-confirmed SpaceSettings fields (from field_3.f3):
// f1=name, f2=description, f3=updated_ts, f4=timezone, f5=OccupancyMode,
// f6=HvacControllerType, f7=occupied_timeout_s(180.0), f8=unoccupied_timeout_s(1200.0)
// Confirmed against the app: fields 1–8 exactly.
// f9=SafetyHeatingMode (freeze protection): iOS app-confirmed in SpaceSettings.safetyHeating
// Field 9 confirmed against the app (app 1.0.29).
message SpaceSettings {
  string name = 1;  // wire-confirmed: f1
  string description = 2;  // wire-confirmed: f2
  google.protobuf.Timestamp updated_ts = 3;  // wire-confirmed: f3
  string timezone = 4;  // wire-confirmed: f4 e.g. "America/Los_Angeles"
  OccupancyMode occupancy = 5;  // wire-confirmed: f5 — ENABLED turns on auto-away/return
  HvacControllerType hvac_controller_type = 6;  // wire-confirmed: f6
  float occupied_timeout_s = 7;  // seconds of presence before "returned"; default 180s (3 min)
  float unoccupied_timeout_s = 8;  // seconds of no-presence before "away"; default 1200s (20 min)
  SafetyHeatingMode safety_heating = 9;  // freeze protection; UNSPECIFIED treated as ENABLED; confirmed against the app f9
}

// Wire-confirmed from UpdateSpace binary (hex decode):
// f1=hvac_mode(varint; COOL=2, HEAT=3 per ordinals)
// f2=temperature_setpoint_c(float),
// f3=updated_ts(Timestamp), f4=cooling_setpoint_c(float/22.777°C),
// f5=heating_setpoint_c(float/20.555°C), f6=absent,
// f7=boost_mode(varint/0=UNSPECIFIED), f8=comfort_setting_override(varint/2=UNTIL_NEXT_SCHEDULE),
// f9=comfort_setting_id_string(string/UUID)
// cooling is at f4, heating is at f5. f2 mirrors whichever setpoint is active (heating in HEAT mode).
message SpaceControls {
  HVACMode hvac_mode = 1;  // wire-confirmed: f1 (varint), COOL=3
  float temperature_setpoint_c = 2;  // wire-confirmed: f2 (float, direct °C)
  google.protobuf.Timestamp updated_ts = 3;  // wire-confirmed: f3
  float cooling_temperature_setpoint_c = 4;  // wire-confirmed: f4 (cooling at 4, not heating!)
  float heating_temperature_setpoint_c = 5;  // wire-confirmed: f5 (heating at 5, not cooling!)
  string comfort_setting_id = 6;  // app proto
  BoostMode boost_mode = 7;  // wire-confirmed: f7 (varint, 0=UNSPECIFIED)
  ComfortSettingOverride comfort_setting_override = 8;  // wire-confirmed: f8 (varint, 2=UNTIL_NEXT_SCHEDULE)
  string comfort_setting_id_string = 9;  // wire-confirmed: f9 (UUID string)
}

// SpaceState wire-confirmed from UpdateSpace response (field_5):
// f1=updated_ts, f2=setpoint_c(float), f3=ambient_temperature_c(21.7°C), f4=HVACState, f5=comfort_setting_id
message SpaceState {
  google.protobuf.Timestamp updated_ts = 1;  // wire-confirmed: f1
  float temperature_setpoint_c = 2;  // wire-confirmed: f2 (app name; was setpoint_temperature_c)
  float ambient_temperature_c = 3;  // wire-confirmed: f3 (observed 21.7°C)
  HVACState hvac_state = 4;  // wire-confirmed: f4
  string comfort_setting_id = 5;  // wire-confirmed: f5
}

// Live demand-response status for a space. New in 1.0.33.
// The offsets are what the event is currently applying to this space's setpoints.
message SpaceDemandResponseState {
  google.protobuf.Timestamp updated_ts = 1;
  DemandResponseEventPhase phase = 2;
  float cooling_offset_c = 3;
  float heating_offset_c = 4;
}

// Space-level occupancy (the derived auto-away result for the whole room). confirmed against the app
// in 1.0.31 and 1.0.33 at Space f76; uses the same enum class as IndoorUnitOccupancy.
message SpaceOccupancy {
  google.protobuf.Timestamp updated_ts = 1;
  OccupancyState occupancy_state = 2;
}

// Wire-confirmed Space field positions (from HomeDatastoreSystem field_3 items):
// f1=EntityMetadata(header), f2=relationships, f3=settings, f4=controls, f5=state
// Confirmed against the app: f6=demand_response_state (new in 1.0.33), f76=occupancy.
message Space {
  EntityMetadata header = 1;  // wire-confirmed: f1
  SpaceRelationships relationships = 2;  // wire-confirmed: f2
  SpaceSettings settings = 3;  // wire-confirmed: f3 (name, timezone, timeouts)
  SpaceControls controls = 4;  // wire-confirmed: f4 (hvac_mode, setpoints)
  SpaceState state = 5;  // wire-confirmed: f5
  SpaceDemandResponseState demand_response_state = 6;  // app 1.0.33: new
  SpaceOccupancy occupancy = 76;  // app 1.0.31+: INCLUDE_OCCUPANCY=76 in the Space field mask too
}

// ---------------------------------------------------------------------------
// Indoor Unit
// ---------------------------------------------------------------------------

// spaceId=2, outdoorUnitId=3, hardwareId=4, quiltSmartModuleId=5, updatedTs=6.
// f1 (customer_account_id, old iOS JSON) is absent from app 1.0.33 and all captures.
message IndoorUnitRelationships {
  reserved 1; reserved "customer_account_id";
  string space_id = 2;
  string outdoor_unit_id = 3;
  string hardware_id = 4;
  string quilt_smart_module_id = 5;
  google.protobuf.Timestamp updated_ts = 6;
  string firmware_update_info_id = 7;
}

// Wire-confirmed from binary decode of IndoorUnit.f3:
// name=1, description=2, lightBrightnessDefaultPercent=3(float), updatedTs=4,
// presenceFenceLeftM=5, presenceFenceRightM=6, presenceFenceForwardM=7,
// radarSensorDistanceFromFloorM=8.
// NOTE: updated_ts at f4 (not f1 as previously assumed).
// app 1.0.33: f9=assigned_outdoor_unit_terminal_port (new; absent in 1.0.31).
message IndoorUnitSettings {
  string name = 1;
  string description = 2;
  float light_brightness_default_percent = 3;  // JSON: "lightBrightnessDefaultPercent"
  google.protobuf.Timestamp updated_ts = 4;
  float presence_fence_left_m = 5;
  float presence_fence_right_m = 6;
  float presence_fence_forward_m = 7;
  float radar_sensor_distance_from_floor_m = 8;
  AssignedOutdoorUnitTerminalPort assigned_outdoor_unit_terminal_port = 9;  // app 1.0.33: new
}

// Wire-confirmed flat field layout from binary decode of IndoorUnit.f4 (40 bytes):
// f1,f2=absent; f3=ledColorCode(varint/uint32), f4=ledColorBrightnessPercent(float),
// f5=fanSpeedMode(varint), f6=fanSpeedPercent(float), f7=updatedTs(Timestamp),
// f8,f9=absent; f10=louverMode(varint), f11=louverFixedPosition(float),
// f12=lightAnimation(varint), f13=lightState(varint).
// NOTE: These are FLAT fields, NOT nested sub-messages.
message IndoorUnitControls {
  // f1, f2 absent in the app
  uint32 led_color_code = 3;  // RGBW packed uint32
  float led_color_brightness_percent = 4;  // stored brightness 0.0–1.0; preserved when led_state=OFF
  FanSpeedMode fan_speed_mode = 5;
  float fan_speed_percent = 6;  // 0.0–1.0
  google.protobuf.Timestamp updated_ts = 7;
  // f8, f9: uuid-string field confirmed at f9 in captures; purpose TBD
  IndoorUnitLouverMode louver_mode = 10;
  float louver_fixed_position = 11;  // position fraction 0.20–1.00, used when louver_mode=FIXED; 0.0 = not applicable
  LightAnimation led_animation = 12;  // confirmed against the app
  LightState led_state = 13;  // wire-confirmed f13: UNSPECIFIED=0,ON=1,OFF=2
                                           // sent when mobile_led_scheduling_enabled Statsig gate is on;
                                           // brightness is PRESERVED (not zeroed) when state=OFF
}

// Field layout confirmed against the app
// 1=updated_ts, 2=temperature_setpoint_c, 3=ambient_temperature_c, 4=hvac_state,
// 5=fan_speed_setpoint_rpm, 6=fan_speed_rpm, 7=light_brightness_percent,
// 8=presence_detection_level, 9=inlet_temperature_c, 10=outlet_temperature_c,
// 11=ambient_humidity_percent, 12=hvac_mode, 13=calculated_ambient_temperature_c,
// 14=louver_angle_up_down_degrees
// 15=test_mode, 16=coil_temperature_c, 17=led_state, 18=inlet_humidity_percent (app 1.0.33).
// led_state here is the device-reported state; IndoorUnitControls.led_state (f13) is the command.
