// A zone of an air-handler-driven duct system; spaces join it via DuctedZoneMembership.
// Damper messages (f7–f9) are new in 1.0.33.
// ---------------------------------------------------------------------------

message DuctedZoneRelationships {
  google.protobuf.Timestamp updated_ts = 1;
  string air_handling_unit_id = 2;
}

message DuctedZoneAttributes {
  google.protobuf.Timestamp updated_ts = 1;
  string name = 2;
}

message DuctedZoneControls {
  google.protobuf.Timestamp updated_ts = 1;
  HVACMode hvac_mode = 2;
  float heating_temperature_setpoint_c = 3;
  float cooling_temperature_setpoint_c = 4;
}

message DuctedZoneClimate {
  google.protobuf.Timestamp updated_ts = 1;
  float temperature_c = 2;
  float humidity_percent = 3;
}

message DuctedZoneOperationalState {
  google.protobuf.Timestamp updated_ts = 1;
  HVACState hvac_state = 2;
}

message DamperCommandedState {  // new in 1.0.33
  google.protobuf.Timestamp updated_ts = 1;
  uint32 commanded_open_percent = 2;
}

message DamperPosition {  // new in 1.0.33
  google.protobuf.Timestamp updated_ts = 1;
  uint32 estimated_open_percent = 2;  // estimated, i.e. no position feedback sensor
}

message DamperConfig {  // new in 1.0.33
  google.protobuf.Timestamp updated_ts = 1;
  DamperPort damper_port = 2;
}

message DuctedZone {
  EntityMetadata header = 1;
  DuctedZoneRelationships relationships = 2;
  DuctedZoneAttributes attributes = 3;
  DuctedZoneControls controls = 4;
  DuctedZoneClimate climate = 5;
  DuctedZoneOperationalState operational_state = 6;
  DamperCommandedState damper_commanded_state = 7;  // new in 1.0.33
  DamperPosition damper_position = 8;  // new in 1.0.33
  DamperConfig damper_config = 9;  // new in 1.0.33
}

message DuctedZoneMembershipRelationships {
  google.protobuf.Timestamp updated_ts = 1;
  string ducted_zone_id = 2;
  string space_id = 3;
}

message DuctedZoneMembershipSettings {
  google.protobuf.Timestamp updated_ts = 1;
  bool contributes_to_zone_temperature = 2;  // whether this space's temp feeds the zone average
}

message DuctedZoneMembership {
  EntityMetadata header = 1;
  DuctedZoneMembershipRelationships relationships = 2;
  DuctedZoneMembershipSettings settings = 3;
}

// ---------------------------------------------------------------------------
// Automation — tree field 23 (RPCs new in 1.0.31; gated by mobile_automation_schedules_enabled)
// Layout unchanged 1.0.31 -> 1.0.33.
// ---------------------------------------------------------------------------

message TimeOfDayTrigger {
  int32 minute_of_day = 1;  // 0..1439, local time
}

message DayOfWeekCondition {
  repeated Weekday days = 1;
}

message AutomationCondition {
  oneof kind {
    DayOfWeekCondition day_of_week = 1;
  }
}

message AutomationTrigger {
  oneof kind {
    TimeOfDayTrigger time = 1;  // only trigger type so far
  }
  repeated AutomationCondition conditions = 2;
}

// Each target kind is its own one-field message in the app.
message AutomationTargetRef {
  string id = 1;
}

message AutomationTarget {
  oneof kind {
    AutomationTargetRef ducted_zone = 1;
    AutomationTargetRef space = 2;
    AutomationTargetRef indoor_unit = 3;
  }
}

message AutomationClimateAction {
  HVACMode hvac_mode = 1;
  float heating_temperature_setpoint_c = 2;
  float cooling_temperature_setpoint_c = 3;
}

// Drives the indoor-unit LED ring. The app's enums here are LED_STATE_* and
// INDOOR_UNIT_LED_ANIMATION_*; numbering matches LightState / LightAnimation.
message AutomationLightAction {
  LightState light_state = 1;
  uint32 color_code = 2;  // packed RGBW, same as IndoorUnitControls.led_color_code
  float brightness_percent = 3;  // 0.0–1.0
  LightAnimation light_animation = 4;
}

message AutomationAction {
  repeated AutomationTarget targets = 1;
  oneof payload {
    AutomationClimateAction climate = 2;
    AutomationLightAction light = 3;
  }
}

message AutomationTriggers { repeated AutomationTrigger items = 1; }
message AutomationActions  { repeated AutomationAction items = 1; }

message AutomationSettings {
  google.protobuf.Timestamp updated_ts = 1;
  bool enabled = 2;
  AutomationTriggers triggers = 3;
  AutomationActions actions = 4;
}

message Automation {
  EntityMetadata header = 1;
  AutomationSettings settings = 2;
}

// ---------------------------------------------------------------------------
// Demand Response Event — tree field 24 (new in 1.0.33)
// A utility demand-response event: precondition -> curtail -> recover. Per-space live
// status is Space.demand_response_state (f6).
// ---------------------------------------------------------------------------

message DemandResponseSourceInfo {
  google.protobuf.Timestamp updated_ts = 1;
  string source_event_id = 2;  // id of the event at the upstream (utility/aggregator) source
}

message DemandResponseOffsetTrajectory {
  google.protobuf.Timestamp precondition_start_ts = 1;
  google.protobuf.Timestamp curtailment_start_ts = 2;
  google.protobuf.Timestamp recovery_start_ts = 3;
  google.protobuf.Timestamp recovery_end_ts = 4;
  float precondition_cooling_offset_c = 5;
  float precondition_heating_offset_c = 6;
  float curtailment_cooling_offset_c = 7;
  float curtailment_heating_offset_c = 8;
  float precondition_ramp_rate_c_per_hour = 9;
}

message DemandResponseTrajectoryPayload {
  oneof kind {
    DemandResponseOffsetTrajectory offset = 1;  // only kind so far: setpoint offsets per phase
  }
}

message DemandResponseTrajectory {
  google.protobuf.Timestamp updated_ts = 1;
  DemandResponseTrajectoryPayload payload = 2;
}

message DemandResponseEvent {
  EntityMetadata header = 1;
  DemandResponseSourceInfo source_info = 2;
  DemandResponseTrajectory trajectory = 3;
}

// ---------------------------------------------------------------------------
// HomeDatastoreSystem (full system snapshot)
// ALL field numbers confirmed against the app (HomeDatastoreSystem proto class).
// Fields 1, 2, 4 are unknown. Fields 12 and 16 are empty for installations
// without standalone remote sensors or configured ControllerRemoteSensors.
// ---------------------------------------------------------------------------

message HomeDatastoreSystem {
  // field 1, 2 — unknown/empty in captured system
  repeated Space spaces = 3;  // confirmed: 6 items
  // field 4 — unknown/empty
  repeated OutdoorUnitHardware outdoor_unit_hardware = 5;  // confirmed: 3 items
  repeated OutdoorUnit outdoor_units = 6;  // confirmed: 3 items
  repeated QuiltSmartModule quilt_smart_modules = 7;  // confirmed: 5 items
  repeated IndoorUnitHardware indoor_unit_hardware = 8;  // confirmed: 5 items
  repeated IndoorUnit indoor_units = 9;  // confirmed: 5 items
  repeated ControllerHardware controller_hardware = 10;  // confirmed: 5 items
  repeated Controller controllers = 11;  // confirmed: 5 items
  repeated RemoteSensor remote_sensors = 12;  // empty without paired sensors
  repeated ComfortSetting comfort_settings = 13;  // confirmed: 20+ items
  repeated ScheduleDay schedule_days = 14;  // confirmed: 5 items
  repeated ScheduleWeek schedule_weeks = 15;  // confirmed: 5 items
  repeated ControllerRemoteSensor controller_remote_sensors = 16;  // empty without sensor mode configured
  repeated Location locations = 17;  // confirmed: 1 item
  repeated SoftwareUpdateInfo software_update_infos = 18;  // confirmed: 28 items (SUI+FUI for all devices)
  repeated AirHandlingUnit air_handling_units = 19;  // app 1.0.33; ducted systems only
  repeated DuctedZone ducted_zones = 20;  // app 1.0.33
  repeated AirHandlingUnitHardware air_handling_unit_hardware = 21;  // app 1.0.33
  repeated DuctedZoneMembership ducted_zone_memberships = 22;  // app 1.0.33
  repeated Automation automations = 23;  // app 1.0.33 (RPCs since 1.0.31)
  repeated DemandResponseEvent demand_response_events = 24;  // app 1.0.33: new
  HomeDatastoreSystemMetadata metadata = 100000;  // app 1.0.33; in every capture
}

message HomeDatastoreSystemMetadata {
  int64 version = 1;  // observed values are epoch nanoseconds (e.g. 1780641683261548256 = 2026-06-05)
}

// ---------------------------------------------------------------------------
// Notifier payloads
// NotifierService delivers each change as NotifierEvent{topic, payload: Any}. The live Any
// type_url is "type.googleapis.com/core.protos.home_datastore.Notification" (verified
// 2026-10-05), so the real message name is Notification and `any.Unpack(Notification())` works.
// (Older notes said "core.protos.hds.Notification"; that was wrong.)
// ---------------------------------------------------------------------------

enum NotificationType {
  NOTIFICATION_TYPE_UNSPECIFIED = 0;
  NOTIFICATION_TYPE_UPDATED = 1;
  NOTIFICATION_TYPE_DELETED = 2;
  NOTIFICATION_TYPE_CHILD_CREATED = 3;
  NOTIFICATION_TYPE_CHILD_DELETED = 4;
  NOTIFICATION_TYPE_CREATED = 5;
}

// One changed HDS object. Field numbers mirror HomeDatastoreSystem.
message HomeDatastoreObjectDiff {
  oneof data {
    Space space = 3;
    OutdoorUnitHardware outdoor_unit_hardware = 5;
    OutdoorUnit outdoor_unit = 6;
    QuiltSmartModule quilt_smart_module = 7;
    IndoorUnitHardware indoor_unit_hardware = 8;
    IndoorUnit indoor_unit = 9;
    ControllerHardware controller_hardware = 10;
    Controller controller = 11;
    RemoteSensor remote_sensor = 12;
    ComfortSetting comfort_setting = 13;
    ScheduleDay schedule_day = 14;
    ScheduleWeek schedule_week = 15;
    ControllerRemoteSensor controller_remote_sensor = 16;
    Location location = 17;
    SoftwareUpdateInfo software_update_info = 18;
    AirHandlingUnit air_handling_unit = 19;
    DuctedZone ducted_zone = 20;
    AirHandlingUnitHardware air_handling_unit_hardware = 21;
    DuctedZoneMembership ducted_zone_membership = 22;
    Automation automation = 23;
    DemandResponseEvent demand_response_event = 24;
  }
}

message Notification {
  NotificationType notification_type = 1;
  HomeDatastoreObjectDiff payload = 2;
  int64 system_version = 3;
}

