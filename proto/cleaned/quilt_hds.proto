// quilt_hds.proto
// Home Datastore (HDS) messages — objects managed by the gRPC API, plus the notifier
// payloads (Notification / HomeDatastoreObjectDiff).
// Field numbers and wire types confirmed against the Quilt app and live captures.

syntax = "proto3";

package core.protos.home_datastore;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";

option java_package = "com.quilt.proto.hds";
option java_outer_classname = "QuiltHdsProto";

// ---------------------------------------------------------------------------
// Enums
// ---------------------------------------------------------------------------

// Confirmed against the app.
// COOL=2, HEAT=3 confirmed. No DRY mode in the proto (was iOS iOS-app-only artifact).
enum HVACMode {
  HVAC_MODE_UNSPECIFIED = 0;
  HVAC_MODE_STANDBY = 1;
  HVAC_MODE_COOL = 2;
  HVAC_MODE_HEAT = 3;
  HVAC_MODE_AUTO = 4;
  HVAC_MODE_FAN = 5;
  HVAC_MODE_FALLBACK_AUTO = 6;
  HVAC_MODE_FALLBACK_OFF = 7;
  HVAC_MODE_DRY = 8;  // iOS app 1.0.26 / user-confirmed: DRY dehumidification mode
}

// Confirmed against the app.
// DRY states added in iOS app 1.0.26 alongside HVAC_MODE_DRY.
enum HVACState {
  HVAC_STATE_UNSPECIFIED = 0;
