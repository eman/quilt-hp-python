// Carried as field 8 on QuiltSmartModule and field 9 on Controller.
// Field numbers/semantics confirmed against the app (app 1.0.29).
// Supersedes the earlier "link_state/version/connection_state" guesses from
// the 2026-06-04 mitmproxy capture (values were device counts + a reason enum).
message LocalCommsStatus {
  google.protobuf.Timestamp updated_ts = 1;  // most-recent server update timestamp
  LocalCommsHealthStatus status = 2;  // current health status; iOS app: localCommsHealth
  int32 visible_devices_count = 3;  // mesh peers currently visible (was "link_state")
  int32 expected_devices_count = 4;  // mesh peers expected on this system (was "version")
  google.protobuf.Timestamp last_session_change_ts = 5;  // when the mesh session last changed
  LocalCommsHealthReason reason = 6;  // diagnostic reason (was "connection_state")
}

