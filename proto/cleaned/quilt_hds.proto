  bool mmwave_phase_detect = 14;
  google.protobuf.Timestamp updated_ts = 15;
  float power_board_temperature_c = 16;
  float main_board_temperature_c = 17;
  float als_illuminance_calib_lx = 18;  // calibrated ambient light, lux
  ControllerOrientation orientation = 19;
  float screen_brightness = 20;  // 0.0–1.0 (0.0 in SLEEP, 0.25 in GLANCE in captures)
  ControllerViewState view_state = 21;
  float sht4x_humidity_percent = 22;  // only some Dials report it (25/55 samples)
