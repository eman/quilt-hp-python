// quilt_notifier.proto
// NotifierService — bidirectional streaming subscription service.
// Confirmed gRPC path: /core.protos.notifier.NotifierService/Subscribe
//
// Message layout:
// SubscribeRequest (oneof: append=2 | remove=3, each a TopicsMessage)
// SubscribeResponse (event=1, a single SubscribeEvent)
// SubscribeEvent (notifier_events=1, control_events=2, system_events=3)
// NotifierEvent (topic=1 string, payload=2 google.protobuf.Any)
// ControlEvent (topics=1 repeated string, type=2 ControlEventType)
// SystemEvent (system_event_type=1)
// NotifierEvent.payload carries a core.protos.home_datastore.Notification (quilt_hds.proto).

syntax = "proto3";

package core.protos.notifier;

import "google/protobuf/any.proto";

option java_package = "com.quilt.proto.notifier";
option swift_prefix = "Quilt";

// ---------------------------------------------------------------------------
// Topics
// ---------------------------------------------------------------------------
// Topics follow the pattern: hds/<object_type>/<object_id>
// e.g. "hds/space/98f9121d-...", "hds/indoor_unit/abc123"
// Object types
// space, outdoor_unit_hardware, outdoor_unit, indoor_unit_hardware,
// indoor_unit, controller_hardware, controller, controller_remote_sensor,
// remote_sensor, quilt_smart_module, schedule_week, schedule_day,
// comfort_setting, location, software_update_info,
// air_handling_unit_hardware, air_handling_unit, ducted_zone,
// ducted_zone_membership, automation (1.0.31+)
// No demand_response_event topic as of 1.0.33, though DR events are HDS tree field 24.

enum ControlEventType {
  CONTROL_EVENT_TYPE_UNSPECIFIED = 0;
  CONTROL_EVENT_TYPE_TOPIC_APPENDED = 1;
  CONTROL_EVENT_TYPE_TOPIC_REMOVED = 2;
  CONTROL_EVENT_TYPE_INVALID_APPEND_TOPIC = 3;
  CONTROL_EVENT_TYPE_INVALID_REMOVE_TOPIC = 4;
  CONTROL_EVENT_TYPE_RECONNECT_REQUEST = 5;
  CONTROL_EVENT_TYPE_PERMISSION_DENIED = 6;
}

enum SystemEventType {
  SYSTEM_EVENT_TYPE_UNSPECIFIED = 0;
  SYSTEM_EVENT_TYPE_SW_UPDATE = 1;
}

message Subscription {
  string topic = 1;
}

message TopicsMessage {
  repeated Subscription subscriptions = 1;
}

message SubscribeRequest {
  oneof message {
    TopicsMessage append = 2;
    TopicsMessage remove = 3;
  }
}

// A data event. topic = "hds/<object_type>/<object_id>"; payload is an Any whose value is
// a core.protos.home_datastore.Notification (Any type_url
// "type.googleapis.com/core.protos.home_datastore.Notification", verified live).
message NotifierEvent {
  string topic = 1;
  google.protobuf.Any payload = 2;
}

// Subscription bookkeeping. The server answers every `append` with TOPIC_APPENDED for each
// topic — these are the periodic "heartbeats" older notes describe (our clients re-send the
// append every 30 s to keep the stream alive).
message ControlEvent {
  repeated string topics = 1;
  ControlEventType type = 2;
}

message SystemEvent {
  SystemEventType system_event_type = 1;
}

message SubscribeEvent {
  repeated NotifierEvent notifier_events = 1;
  repeated ControlEvent control_events = 2;
  repeated SystemEvent system_events = 3;
}

message SubscribeResponse {
  SubscribeEvent event = 1;
}

service NotifierService {
  rpc Subscribe(stream SubscribeRequest) returns (stream SubscribeResponse);
  // Publish was removed from the app in 1.0.31 but still exists server-side (existence probe
  // 2026-10-05). Its message shape is unknown and it was deliberately never called.
}
